<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Check</title>
</head>
<body>
    <h2>Welcome! Click the button to proceed.</h2>
    <button id="checkIP">Check Location & Proceed</button>

    <script>
       document.getElementById("checkIP").addEventListener("click", function () {
            fetch("http://ip-api.com/json/")
                .then(response => response.json())
                .then(data => {
                    let userIP = data.query; // User ka IP address
                    let allowedIPs ="43.248.241.200"; // Yahan apne office ka IP likho

                    if (allowedIPs.includes(userIP)) {
                        window.location.href = "dashboard.html"; // Allowed IP par redirect
                    } else {
                        alert("Access Denied! Aap sahi jagah par nahi hain.");
                    }
                })
                .catch(error => console.error("Error fetching IP:", error));
        });
       /* fetch("http://ip-api.com/json/")
    .then(response => response.json())
    .then(data => {
        console.log("Your IP:", data.query);  // 👀 Console me check karo
    });*/
    </script>
</body>
</html>
